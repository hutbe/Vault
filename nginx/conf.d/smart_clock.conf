#图片服务器服务
server {
    listen 8010 ssl;
    server_name default_server ssl;

    # 证书路径（由脚本生成或挂载）
    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 基础设置
    ssl_session_timeout 1h;                 #缓存有效期
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;    #安全链接可选的加密协议
    ssl_ciphers         HIGH:!aNULL:!MD5;   #加密算法
    ssl_prefer_server_ciphers on;           #优先使用服务器端的加密算法

    # 安全头片段
    include /etc/nginx/snippets/security.conf;

    root /usr/share/nginx/www/dist/smart_clock;

    # 指定索引文件顺序
    index index.html index.htm;

    location / {
        # CORS 配置
        include /etc/nginx/snippets/cors_headers.conf;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }

    # 健康检查
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}